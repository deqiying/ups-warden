<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">UPS Warden 停电联动流程（设计目标）</title>
  <desc id="desc">规划中的停电联动流程，尚未实现：市电中断（状态位 b7 = 1）→ 去抖确认（持续 10 秒，过滤闪断）→ 发送通知（Webhook、Telegram）→ 分阶段关机（先 PC 后 NAS）→ 最后关闭 ups-warden 所在主机。阈值、阶段与目标主机均在 WebUI 中配置。</desc>

  <rect width="1200" height="380" rx="24" fill="#0D1311"/>

  <g id="header" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="64" y="72" font-family="SFMono-Regular, Menlo, Consolas, 'Cascadia Mono', monospace" font-size="18" letter-spacing="2" fill="#8C9A92">OUTAGE → NOTIFY → SHUTDOWN</text>
    <rect x="946" y="48" width="190" height="36" rx="18" fill="none" stroke="#F2B544" stroke-opacity="0.7"/>
    <text x="1041" y="72" text-anchor="middle" font-size="18" fill="#F2B544">设计目标 · 尚未实现</text>
  </g>

  <line id="track" x1="140" y1="176" x2="1060" y2="176" stroke="#26312C" stroke-width="4" stroke-linecap="round"/>
  <line id="progress" x1="140" y1="176" x2="1060" y2="176" stroke="#F2B544" stroke-width="4" stroke-linecap="round"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <g id="station-1">
      <text x="140" y="140" font-size="18" fill="#8C9A92">T+0</text>
      <circle cx="140" cy="176" r="14" fill="#F2B544"/>
      <text x="140" y="234" font-size="24" font-weight="700" fill="#ECF1EC">市电中断</text>
      <text x="140" y="268" font-size="18" fill="#8C9A92">状态位 b7 = 1</text>
    </g>
    <g id="station-2">
      <text x="370" y="140" font-size="18" fill="#8C9A92">T+10 s</text>
      <circle cx="370" cy="176" r="14" fill="#0D1311" stroke="#F2B544" stroke-width="4"/>
      <text x="370" y="234" font-size="24" font-weight="700" fill="#ECF1EC">去抖确认</text>
      <text x="370" y="268" font-size="18" fill="#8C9A92">持续 10 s，过滤闪断</text>
    </g>
    <g id="station-3">
      <text x="600" y="140" font-size="18" fill="#8C9A92">确认后立即</text>
      <circle cx="600" cy="176" r="14" fill="#0D1311" stroke="#F2B544" stroke-width="4"/>
      <text x="600" y="234" font-size="24" font-weight="700" fill="#ECF1EC">发送通知</text>
      <text x="600" y="268" font-size="18" fill="#8C9A92">Webhook · Telegram</text>
    </g>
    <g id="station-4">
      <text x="830" y="140" font-size="18" fill="#8C9A92">满足关机条件</text>
      <circle cx="830" cy="176" r="14" fill="#0D1311" stroke="#F2B544" stroke-width="4"/>
      <text x="830" y="234" font-size="24" font-weight="700" fill="#ECF1EC">分阶段关机</text>
      <text x="830" y="268" font-size="18" fill="#8C9A92">阶段 1 PC → 阶段 2 NAS</text>
    </g>
    <g id="station-5">
      <text x="1060" y="140" font-size="18" fill="#8C9A92">最后阶段</text>
      <circle cx="1060" cy="176" r="14" fill="#0D1311" stroke="#F2B544" stroke-width="4"/>
      <text x="1060" y="234" font-size="24" font-weight="700" fill="#ECF1EC">关闭本机</text>
      <text x="1060" y="268" font-size="18" fill="#8C9A92">ups-warden 最后退出</text>
    </g>
  </g>

  <text id="footnote" x="64" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#8C9A92">示意：时长阈值、关机条件、阶段与目标主机均在 WebUI 中配置；倒计时内市电恢复则自动取消。</text>
</svg>
