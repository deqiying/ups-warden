min_version = "2026.9.11"

[tools]
# Go 官方当前最新补丁为 1.27.2；1.27.3 发布后在此升级。
go = "1.27.2"
node = "24.21.0"
pnpm = "12.11.2"

[env]
# 所有工具缓存统一放在仓库根目录 .cache/ 下，不使用用户全局缓存目录。
# 禁止 go 命令按 go.mod 的 toolchain 指令自动下载其他版本，版本只由本文件管理。
GOTOOLCHAIN = "local"
GOPATH = "{{config_root}}/.cache/go/path"
GOBIN = "{{config_root}}/.cache/go/path/bin"
GOMODCACHE = "{{config_root}}/.cache/go/mod"
GOCACHE = "{{config_root}}/.cache/go/build"
NODE_COMPILE_CACHE = "{{config_root}}/.cache/node/compile-cache"
npm_config_cache = "{{config_root}}/.cache/npm"
pnpm_config_cache_dir = "{{config_root}}/.cache/pnpm/cache"
pnpm_config_store_dir = "{{config_root}}/.cache/pnpm/store"

[tasks."backend:check"]
description = "检查后端格式、静态分析和测试"
dir = "backend"
shell = "bash -c"
run = '''
set -eu
unformatted="$(gofmt -l .)"
if [ -n "$unformatted" ]; then
  printf '以下文件需要 gofmt：\n%s\n' "$unformatted"
  exit 1
fi
go vet ./...
go test ./...
'''

[tasks."webui:build"]
description = "构建前端并安全复制到后端 embed 目录"
dir = "{{config_root}}"
run = ["pnpm --dir frontend build", "node scripts/build-webui.mjs"]

[tasks."backend:build"]
description = "构建包含内嵌 WebUI 的本机纯 Go 后端"
depends = ["webui:build"]
dir = "backend"
env.CGO_ENABLED = "0"
run = "go build -trimpath -o ../.cache/build/ ./cmd/ups-warden"

[tasks."backend:release"]
description = "交叉编译 linux/amd64、linux/arm64、windows/amd64 发布二进制（内嵌 WebUI，注入版本号）"
depends = ["webui:build"]
dir = "backend"
shell = "bash -c"
env.CGO_ENABLED = "0"
run = '''
set -eu
# 版本号优先取 VERSION 环境变量，其次 git describe。
version="${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}"
out=../.cache/build/release
mkdir -p "$out"
for target in linux/amd64 linux/arm64 windows/amd64; do
  os="${target%/*}"
  arch="${target#*/}"
  ext=""
  if [ "$os" = windows ]; then ext=".exe"; fi
  GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$out/ups-warden-$os-$arch$ext" ./cmd/ups-warden
  printf '%s %s\n' "$version" "$out/ups-warden-$os-$arch$ext"
done
'''

[tasks."backend:acceptance"]
description = "运行 AC-01~11 中可自动化部分的验收测试（模拟器，不访问真实设备）"
dir = "backend"
shell = "bash -c"
# acceptance 为经 HTTP API 的黑盒用例；app 中的用例使用可控时钟覆盖计划编排、dry-run 与重启。
run = "go test -count=1 -v -run '^(TestAcceptance.*|TestLoopbackPipelineFlashLostRestart|TestM6OutageNotificationAndDryRun|TestM7.*)$' ./internal/acceptance ./internal/app"

[tasks."backend:load"]
description = "压测：模拟器 32 / 100 台设备、3 s 轮询，输出内存、CPU、通知与 SSE 延迟"
dir = "backend"
env.UPS_WARDEN_LOAD = "32,100"
shell = "bash -c"
run = "go test -count=1 -v -timeout 30m -run '^TestLoad$' ./internal/acceptance"
