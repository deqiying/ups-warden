schema: 1
key: rfc1628-generic
name: RFC 1628 UPS-MIB（通用）
version: 1
protocol: snmp
snmp: {strategy: getbulk, bulk_root: 1.3.6.1.2.1.33, max_repetitions: 60}
power_hints: {indicators: [output_source, native_seconds_on_battery, input_voltage]}
fields:
  - {field: manufacturer, source: {oid: 1.3.6.1.2.1.33.1.1.1.0}, type: string}
  - {field: model, source: {oid: 1.3.6.1.2.1.33.1.1.2.0}, type: string}
  - {field: firmware, source: {oid: 1.3.6.1.2.1.33.1.1.3.0}, type: string}
  - {field: agent_version, source: {oid: 1.3.6.1.2.1.33.1.1.4.0}, type: string}
  - {field: name, source: {oid: 1.3.6.1.2.1.33.1.1.5.0}, type: string}
  - {field: battery_status, source: {oid: 1.3.6.1.2.1.33.1.2.1.0}, type: int, enum: {1: unknown, 2: normal, 3: low, 4: depleted}}
  - {field: native_seconds_on_battery, source: {oid: 1.3.6.1.2.1.33.1.2.2.0}, type: int}
  - {field: native_runtime_remaining, source: {oid: 1.3.6.1.2.1.33.1.2.3.0}, type: int, unit: min}
  - {field: battery_capacity_pct, source: {oid: 1.3.6.1.2.1.33.1.2.4.0}, type: int}
  - {field: battery_voltage, source: {oid: 1.3.6.1.2.1.33.1.2.5.0}, type: int, scale: 0.1}
  - {field: battery_current, source: {oid: 1.3.6.1.2.1.33.1.2.6.0}, type: int, scale: 0.1}
  - {field: temperature, source: {oid: 1.3.6.1.2.1.33.1.2.7.0}, type: int}
  - {field: input_phases, source: {oid: 1.3.6.1.2.1.33.1.3.2.0}, type: int, invalid: {range: [1, 3]}}
  - {field: input_freq, source: {oid: 1.3.6.1.2.1.33.1.3.3.1.2.1}, type: int, scale: 0.1}
  - {field: 'input_voltage[1]', source: {oid: 1.3.6.1.2.1.33.1.3.3.1.3.1}, type: int}
  - {field: 'input_voltage[2]', source: {oid: 1.3.6.1.2.1.33.1.3.3.1.3.2}, type: int}
  - {field: 'input_voltage[3]', source: {oid: 1.3.6.1.2.1.33.1.3.3.1.3.3}, type: int}
  - {field: 'input_current[1]', source: {oid: 1.3.6.1.2.1.33.1.3.3.1.4.1}, type: int, scale: 0.1}
  - {field: 'input_current[2]', source: {oid: 1.3.6.1.2.1.33.1.3.3.1.4.2}, type: int, scale: 0.1}
  - {field: 'input_current[3]', source: {oid: 1.3.6.1.2.1.33.1.3.3.1.4.3}, type: int, scale: 0.1}
  - {field: 'input_power[1]', source: {oid: 1.3.6.1.2.1.33.1.3.3.1.5.1}, type: int}
  - {field: 'input_power[2]', source: {oid: 1.3.6.1.2.1.33.1.3.3.1.5.2}, type: int}
  - {field: 'input_power[3]', source: {oid: 1.3.6.1.2.1.33.1.3.3.1.5.3}, type: int}
  - {field: output_source, source: {oid: 1.3.6.1.2.1.33.1.4.1.0}, type: int, enum: {1: other, 2: none, 3: normal, 4: bypass, 5: battery, 6: booster, 7: reducer}}
  - {field: output_freq, source: {oid: 1.3.6.1.2.1.33.1.4.2.0}, type: int, scale: 0.1}
  - {field: output_phases, source: {oid: 1.3.6.1.2.1.33.1.4.3.0}, type: int, invalid: {range: [1, 3]}}
  - {field: 'output_voltage[1]', source: {oid: 1.3.6.1.2.1.33.1.4.4.1.2.1}, type: int}
  - {field: 'output_voltage[2]', source: {oid: 1.3.6.1.2.1.33.1.4.4.1.2.2}, type: int}
  - {field: 'output_voltage[3]', source: {oid: 1.3.6.1.2.1.33.1.4.4.1.2.3}, type: int}
  - {field: 'output_current[1]', source: {oid: 1.3.6.1.2.1.33.1.4.4.1.3.1}, type: int, scale: 0.1}
  - {field: 'output_current[2]', source: {oid: 1.3.6.1.2.1.33.1.4.4.1.3.2}, type: int, scale: 0.1}
  - {field: 'output_current[3]', source: {oid: 1.3.6.1.2.1.33.1.4.4.1.3.3}, type: int, scale: 0.1}
  # RFC 输出功率列 4 为 W，不等价于统一 output_power 的 VA，不映射。
  - {field: 'output_load_pct[1]', source: {oid: 1.3.6.1.2.1.33.1.4.4.1.5.1}, type: int}
  - {field: 'output_load_pct[2]', source: {oid: 1.3.6.1.2.1.33.1.4.4.1.5.2}, type: int}
  - {field: 'output_load_pct[3]', source: {oid: 1.3.6.1.2.1.33.1.4.4.1.5.3}, type: int}
  - {field: bypass_freq, source: {oid: 1.3.6.1.2.1.33.1.5.1.0}, type: int, scale: 0.1}
  # 标准旁路列 3/4/5 = 电压/电流/有功功率；列 5 的 W 同样不能映射为 VA。
  - {field: 'bypass_voltage[1]', source: {oid: 1.3.6.1.2.1.33.1.5.3.1.3.1}, type: int}
  - {field: 'bypass_voltage[2]', source: {oid: 1.3.6.1.2.1.33.1.5.3.1.3.2}, type: int}
  - {field: 'bypass_voltage[3]', source: {oid: 1.3.6.1.2.1.33.1.5.3.1.3.3}, type: int}
  - {field: 'bypass_current[1]', source: {oid: 1.3.6.1.2.1.33.1.5.3.1.4.1}, type: int, scale: 0.1}
  - {field: 'bypass_current[2]', source: {oid: 1.3.6.1.2.1.33.1.5.3.1.4.2}, type: int, scale: 0.1}
  - {field: 'bypass_current[3]', source: {oid: 1.3.6.1.2.1.33.1.5.3.1.4.3}, type: int, scale: 0.1}
  - {field: nominal_input_voltage, source: {oid: 1.3.6.1.2.1.33.1.9.1.0}, type: int}
  - {field: nominal_input_freq, source: {oid: 1.3.6.1.2.1.33.1.9.2.0}, type: int, scale: 0.1}
  - {field: nominal_output_voltage, source: {oid: 1.3.6.1.2.1.33.1.9.3.0}, type: int}
  - {field: nominal_output_freq, source: {oid: 1.3.6.1.2.1.33.1.9.4.0}, type: int, scale: 0.1}
  - {field: rated_va, source: {oid: 1.3.6.1.2.1.33.1.9.5.0}, type: int}
  - {field: rated_w, source: {oid: 1.3.6.1.2.1.33.1.9.6.0}, type: int}
